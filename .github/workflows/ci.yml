name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'rust/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'rust/**'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single-threaded test execution for resource constraints
  RUST_TEST_THREADS: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: ./rust
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: clippy

      - name: Run clippy
        working-directory: ./rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ${{ matrix.os }}

      - name: Build workspace
        working-directory: ./rust
        run: cargo build --workspace --all-features --verbose

      - name: Build tests
        working-directory: ./rust
        run: cargo test --workspace --all-features --no-run --verbose

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: test-${{ matrix.os }}

      - name: Run tests (single-threaded)
        working-directory: ./rust
        run: cargo test --workspace --all-features --verbose -- --test-threads=1

      - name: Run doctests
        working-directory: ./rust
        run: cargo test --doc --workspace --all-features --verbose

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: coverage

      - name: Generate coverage report
        working-directory: ./rust
        run: cargo tarpaulin --workspace --all-features --timeout 300 --out xml --out html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./rust/cobertura.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            ./rust/cobertura.xml
            ./rust/tarpaulin-report.html

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: doc

      - name: Build documentation
        working-directory: ./rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        working-directory: ./rust
        run: cargo audit

  build-release:
    name: Build Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rusty-claude-cli
            artifact_name: rusty-claude-cli-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: rusty-claude-cli
            artifact_name: rusty-claude-cli-macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rusty-claude-cli.exe
            artifact_name: rusty-claude-cli-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-${{ matrix.os }}

      - name: Build release binary
        working-directory: ./rust
        run: cargo build --package rusty-claude-cli --release --features cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: rust/target/release/${{ matrix.binary_name }}
          if-no-files-found: error

  check:
    name: Check Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: check

      - name: Cargo check
        working-directory: ./rust
        run: cargo check --workspace --all-features --verbose

      - name: Check lockfile
        working-directory: ./rust
        run: cargo update --workspace --locked
