[package]
name = "state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt", "sync", "macros", "time"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
dirs = "5"
regex = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
